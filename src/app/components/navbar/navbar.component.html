<!-- s: DESKTOP -->
<nav
  class="desktopNav max-sm:hidden w-full h-[64px] bg-gray-800/95 flex items-center justify-between px-[120px] border-b border-b-white/15"
>
  <div class="flex items-center gap-4">
    <div>
      <img src="./images/rocket.png" alt="rocket" width="28" />
    </div>
    <span class="text-white font-bold tracking-wide text-lg"
      >Airdrop Tracker</span
    >
  </div>

  <div class="flex items-center gap-6">
    <ul class="flex items-center gap-6">
      <li *ngFor="let item of navItem">
        <a
          [routerLink]="item.route"
          routerLinkActive="!text-white"
          [routerLinkActiveOptions]="{ exact: true }"
          class="text-white/50 hover:text-white"
        >
          <span class="tracking-wider text-sm">{{ item.name }}</span>
        </a>
      </li>

      <li>
        <button
          type="button"
          (click)="signOut()"
          class="cursor-pointer hover:text-white text-white/50"
        >
          <span class="text-sm tracking-wider">Sign Out</span>
        </button>
      </li>
    </ul>

    <div class="w-px h-[28px] bg-white/50"></div>

    <div
      class="rounded-full p-[2px] bg-gradient-to-tr from-blue-500 via-white to-blue-500 inline-block"
    >
      <img src="./images/user.png" alt="user" width="30" />
    </div>
  </div>
</nav>
<!-- e: DESKTOP -->

<!-- s: MOBILE -->
<nav
  class="mobileNav md:hidden w-full h-[64px] bg-gray-800/95 flex items-center justify-between px-6"
>
  <div>
    <button type="button" (click)="toggleNavbar()">
      <i-feather name="menu" class="text-white/80" />
    </button>
  </div>

  <div
    [ngClass]="{
      'opacity-0 scale-95 pointer-events-none': isOpen,
      'opacity-100 scale-100': !isOpen
    }"
    class="transition duration-300 transform"
  >
    <img src="./images/user.png" alt="user" width="30" />
  </div>
</nav>

<section
  class="mobileNavBody md:hidden fixed top-[64px] left-0 w-full bg-gray-800 h-[calc(100%-64px)] overflow-y-auto flex flex-col px-6 transform transition-transform duration-300 pb-8 z-40"
  [ngClass]="{
    'translate-x-0': isOpen,
    '-translate-x-full': !isOpen
  }"
>
  <div class="flex items-center px-2 gap-6 py-8">
    <div
      class="rounded-full p-1 bg-gradient-to-tr from-blue-500 via-white to-blue-500 inline-block"
    >
      <img src="./images/user.png" alt="user" width="60" />
    </div>

    <div>
      <h1 class="text-white text-lg">{{ userName }}</h1>
      <span class="text-white/80">{{ userEmail }}</span>
    </div>
  </div>

  <div class="h-[1px] bg-white/50 mt-4 mb-4"></div>

  <!-- MOBILE NAV MENU -->
  <div class="flex flex-col gap-3 py-8">
    <ul class="flex flex-col gap-8">
      <li *ngFor="let item of navItem">
        <a routerLink="{{ item.route }}">
          <div class="flex items-center gap-6 text-white px-2">
            <div class="h-5">
              <i-feather name="{{ item.icon }}" class="!w-5" />
            </div>
            <span class="tracking-wider">{{ item.name }}</span>
          </div>
        </a>
      </li>

      <li>
        <button type="button" (click)="signOut()">
          <div class="flex items-center gap-6 text-white px-2">
            <div class="h-5">
              <i-feather name="log-out" class="!w-5" />
            </div>
            <span class="tracking-wider">Sign Out</span>
          </div>
        </button>
      </li>
    </ul>
  </div>

  <!-- MOBILE NAV FOOTER -->
  <div class="rounded-lg bg-gray-800 mt-auto px-2">
    <h2 class="text-white/80 tracking-wide font-light text-sm">
      &copy; Copyright 2025 Airdrop Tracker.
    </h2>
  </div>
</section>
<!-- e: MOBILE -->
