<!-- Form -->
<div class="border border-white/50 rounded-lg p-4 mt-4">
  <div class="mb-4 pb-4 border-b border-b-white/15">
    <h2 class="text-white tracking-wide">Edit Airdrop</h2>
  </div>

  <form>
    <div class="md:grid md:grid-cols-3 gap-4 mb-6">
      <div class="max-sm:mb-4">
        <label for="name" class="form-label block mb-2">
          Name
          <span class="form-required">*</span>
        </label>

        <input
          type="text"
          id="name"
          name="name"
          placeholder="Airdrop name"
          class="form-input"
          autofocus
        />
      </div>

      <div class="max-sm:mb-4">
        <label for="name" class="form-label block mb-2">
          Link
          <span class="form-required">*</span>
        </label>

        <input
          type="text"
          id="link"
          name="link"
          placeholder="Airdrop link"
          class="form-input"
        />
      </div>

      <div class="max-sm:mb-4">
        <label for="name" class="form-label block mb-2"> Faucet Link </label>
        <input
          type="text"
          id="faucetLink"
          name="faucetLink"
          placeholder="Airdrop faucet link"
          class="form-input"
        />
      </div>

      <div class="max-sm:mb-4">
        <label for="name" class="form-label block mb-2"> Referral Link </label>

        <input
          type="text"
          id="referralLink"
          name="referralLink"
          placeholder="Referral Link"
          class="form-input"
        />
      </div>

      <div class="max-sm:mb-4">
        <label for="name" class="form-label block mb-2">
          Type
          <span class="form-required">*</span>
        </label>

        <select name="type" id="type" class="form-input">
          <option value="" disabled selected>Select an options</option>
          <option value="1">Testnet</option>
          <option value="2">DePin</option>
        </select>
      </div>

      <div class="max-sm:mb-4">
        <label for="name" class="form-label block mb-2">
          Login Method
          <span class="form-required">*</span>
        </label>
        <input
          type="text"
          id="loginType"
          name="loginType"
          placeholder="Airdrop login method. Ex: Metamask, Phantom"
          class="form-input"
        />
      </div>

      <div class="max-sm:mb-4">
        <label for="name" class="form-label block mb-2"> Wallet Address </label>

        <input
          type="text"
          id="wallet"
          name="wallet"
          placeholder="Wallet Address"
          class="form-input"
        />
      </div>

      <div class="max-sm:mb-4">
        <label for="name" class="form-label block mb-2">
          Status
          <span class="form-required">*</span>
        </label>

        <input
          type="text"
          id="status"
          name="status"
          placeholder="Airdrop status"
          class="form-input"
        />
      </div>

      <div class="max-sm:mb-4">
        <label for="name" class="form-label block mb-2">
          Airdrop Parent
          <span class="form-required">*</span>
        </label>

        <input
          type="text"
          id="parentId"
          name="parentId"
          placeholder="Airdrop Parent"
          class="form-input"
        />
      </div>

      <div class="md:col-span-3">
        <label for="name" class="form-label block mb-2">
          Airdrop Description
        </label>

        <input
          type="text"
          id="description"
          name="description"
          placeholder="Airdrop description"
          class="form-input"
        />
      </div>
    </div>

    <div class="flex justify-end space-x-3">
      <a routerLink="/" class="outline-btn-secondary">Cancel</a>
      <button class="outline-btn-primary">Submit</button>
    </div>
  </form>
</div>
